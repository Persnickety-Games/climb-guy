<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Climber</title>
  <script>
    // Load the game files with a version stamp so phones never keep running an
    // old cached copy after an update (at most a minute old).
    window.CLIMBER_V = Math.floor(Date.now() / 60000);
    document.write('<link rel="stylesheet" href="style.css?v=' + window.CLIMBER_V + '">');
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <button id="tune-btn" aria-label="Tuning">⚙</button>
  <div id="tune" hidden>
    <h2>Tuning</h2>
    <div id="tune-fields"></div>
    <div class="tune-actions">
      <button id="tune-reset">Reset defaults</button>
      <button id="tune-close">Close</button>
    </div>
  </div>

  <div id="over-actions" hidden>
    <button id="share-btn">Share</button>
    <button id="reroll-btn" aria-label="Try a different unit">🎲</button>
    <div id="share-status" aria-live="polite"></div>
  </div>

  <script>
    document.write('<script src="units.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="game.js?v=' + window.CLIMBER_V + '"><\/script>');
  </script>
</body>
</html>
