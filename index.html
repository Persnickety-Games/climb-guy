<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Climb Guy</title>
  <meta name="apple-mobile-web-app-title" content="Climb Guy">
  <meta name="description" content="Two thumbs, two hands. Climb as high as you can before the water gets you.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Climb Guy 🧗">
  <meta property="og:description" content="Two thumbs, two hands. Climb as high as you can before the water gets you. Can you beat my height?">
  <meta property="og:url" content="https://climbguy.xyz/">
  <meta property="og:image" content="https://climbguy.xyz/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="icon.png">
  <script>
    // Load the game files with a version stamp so phones never keep running an
    // old cached copy after an update (at most a minute old).
    window.CLIMBER_V = Math.floor(Date.now() / 60000);
    // Mouse and keyboard, or touch? A first guess from the device; the game
    // switches as soon as someone clicks, touches or presses a grab key.
    window.Controls = { mouse: matchMedia('(hover: hover) and (pointer: fine)').matches };
    document.write('<link rel="stylesheet" href="style.css?v=' + window.CLIMBER_V + '">');
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="start" tabindex="0" aria-label="Start screen">
    <h1>Climb Guy</h1>
    <p id="start-day"></p>
    <p id="start-line"></p>
    <p id="start-tap" class="start-tap">Tap anywhere to start</p>
    <button id="start-skip" class="start-skip" hidden>Skip training ›</button>
    <div id="start-done" hidden>
      <p id="done-score"></p>
      <p id="done-vs"></p>
      <p id="done-next"></p>
      <div class="done-actions">
        <button id="done-share" class="done-primary">Share</button>
        <button data-mode="endless">🌊 Endless</button>
        <button data-mode="sprint">⏱️ Sprint</button>
      </div>
      <p id="done-status" aria-live="polite"></p>
      <button class="feedback-btn done-feedback" hidden>💬 Send feedback</button>
    </div>
    <p class="start-by">by Persnickety Games</p>
  </div>

  <button id="menu-btn" aria-label="Stats, badges and customize">☰</button>
  <button id="tune-btn" aria-label="Tuning" hidden>⚙</button>
  <div id="tune" hidden>
    <h2>Tuning</h2>
    <div id="tune-fields"></div>
    <div class="tune-actions">
      <button id="tune-reset">Reset defaults</button>
      <button id="tune-close">Close</button>
    </div>
  </div>

  <div id="learn-actions" hidden>
    <button id="learn-retry">↻ Try the climb again</button>
    <button id="learn-skip" class="learn-secondary">Skip to the daily ›</button>
  </div>

  <div id="over-actions" hidden>
    <button id="share-btn">Share</button>
    <button id="reroll-btn" aria-label="Try a different unit">🎲</button>
    <button id="customize-btn">🎨 Customize</button>
    <input id="name-input" maxlength="20" autocomplete="nickname" placeholder="Your name (for challenge links)">
    <div id="share-status" aria-live="polite"></div>
    <div id="over-modes" hidden>
      <button data-mode="endless">🌊 Endless</button>
      <button data-mode="sprint">⏱️ Sprint</button>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="menu-panel">
      <header class="menu-head">
        <nav class="menu-tabs">
          <button data-tab="stats"><span class="tab-icon">📊</span>Stats</button>
          <button data-tab="passport"><span class="tab-icon">🗺️</span>Passport</button>
          <button data-tab="badges"><span class="tab-icon">🏅</span>Badges</button>
          <button data-tab="customize"><span class="tab-icon">🎨</span>Customize</button>
          <button data-tab="modes"><span class="tab-icon">🎮</span>Modes</button>
        </nav>
        <button class="menu-close" aria-label="Close">✕</button>
      </header>
      <div class="menu-body"></div>
      <footer class="menu-foot">
        <button class="tutorial-btn">❓ How to play</button>
        <button class="feedback-btn" hidden>💬 Send feedback</button>
      </footer>
    </div>
  </div>

  <!-- PixelPicked badge: the menu shows a copy at the bottom of each tab. -->
  <template id="pp-badge">
<a href="https://pixelpicked.com/game/4CCudGAQNbT/climb-guy/" target="_blank" rel="noopener">
<img src="https://api.pixelpicked.com/api/badges/4CCudGAQNbT/live.png?theme=dark"
    width="250" height="54" alt="Approved on PixelPicked" />
</a>
  </template>

  <div id="tutorial" hidden>
    <div class="tut-panel" role="dialog" aria-label="How to play">
      <div class="tut-top"><span class="tut-step"></span><button class="tut-skip">Skip</button></div>
      <canvas class="tut-art"></canvas>
      <h2 class="tut-title"></h2>
      <p class="tut-text"></p>
      <div class="tut-dots"></div>
      <div class="tut-actions"><button class="tut-back">Back</button><button class="tut-next">Next</button></div>
    </div>
  </div>

  <div id="intro" hidden>
    <div class="intro-panel" role="dialog" aria-label="How to climb">
      <canvas class="intro-art"></canvas>
      <button class="intro-go" hidden>Let's go ›</button>
    </div>
  </div>

  <div id="feedback" hidden>
    <div class="fb-panel" role="dialog" aria-label="Send feedback">
      <h2>💬 Feedback</h2>
      <p class="fb-note">Bugs, ideas, anything confusing or fun. It goes straight to the person making the game.</p>
      <textarea id="fb-text" maxlength="2000" rows="6" placeholder="What's on your mind?"></textarea>
      <input id="fb-contact" maxlength="100" autocomplete="off" placeholder="Name or email, if you'd like a reply (optional)">
      <div class="fb-actions">
        <button id="fb-cancel">Cancel</button>
        <button id="fb-send">Send</button>
      </div>
      <p id="fb-status" aria-live="polite"></p>
    </div>
  </div>

  <script>
    document.write('<script src="daily.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="skins.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="progress.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="menu.js?v=' + window.CLIMBER_V + '"><\/script>');
  </script>
  <script>
    document.write('<script src="analytics.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="feedback.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="tutorial.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="units.js?v=' + window.CLIMBER_V + '"><\/script>' +
                   '<script src="game.js?v=' + window.CLIMBER_V + '"><\/script>');
  </script>
  <script>
    // If the game didn't load (most often a tab coming back after a while with
    // no connection yet), the page would sit on "Tap anywhere to start" doing
    // nothing. Reload once by itself; if that fails too, say so and retry on a
    // tap or when the connection comes back.
    window.addEventListener('load', function () {
      if (window.climber) { try { sessionStorage.removeItem('cg.reloaded'); } catch (e) {} return; }
      var retried = false;
      try { retried = sessionStorage.getItem('cg.reloaded') === '1'; sessionStorage.setItem('cg.reloaded', '1'); } catch (e) {}
      var reload = function () { location.reload(); };
      if (!retried && navigator.onLine !== false) { setTimeout(reload, 300); return; }
      var tap = document.getElementById('start-tap');
      if (tap) tap.textContent = "Couldn't load. Tap to try again.";
      document.getElementById('start').addEventListener('pointerdown', reload);
      window.addEventListener('online', reload);
    });
  </script>
</body>
</html>
