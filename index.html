<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arcade</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #0b1d2e; color: #fff;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 24px; }
    a.game { display: block; padding: 18px 20px; margin-bottom: 12px; border-radius: 12px;
             background: #1b3550; color: #fff; text-decoration: none; }
    a.game strong { display: block; font-size: 20px; }
    a.game span { opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Arcade</h1>
    <a class="game" href="climber/">
      <strong>Climber</strong>
      <span>Two thumbs, two hands. Throw, grab, hold on, and outclimb the rising water. (Mobile)</span>
    </a>
    <a class="game" href="climber-classic/">
      <strong>Climber Classic</strong>
      <span>The original one-finger slingshot version with auto-grab.</span>
    </a>
  </main>
</body>
</html>
